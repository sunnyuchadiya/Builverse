<body class="min-h-screen flex flex-col font-body-md text-on-surface">
<!-- Suppressed Shell: BottomNavBar and TopAppBar are excluded as per "Destination Rule" (Transactional Flow) -->
<main class="flex-grow flex items-center justify-center px-container-padding py-12 relative overflow-hidden">
<!-- Atmospheric Background Element -->
<div class="absolute top-0 right-0 -mr-20 -mt-20 opacity-10 pointer-events-none">
<div class="w-[600px] h-[600px] bg-cover bg-center rounded-full filter blur-3xl" data-alt="A sophisticated abstract architectural render of glass and steel structures, captured in soft morning light with a clean Scandinavian aesthetic. The composition features sharp angles and deep contrasts of black and white, embodying a sense of precision and premium craftsmanship. Soft gradients transition from crisp whites to deep shadows, creating a calm yet powerful atmosphere for a developer-centric digital space." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCRPKHI3fKGpA6Hplwz_-ZxfxU4KM2Okz-5jWYSybuZfMOxqM4gcTiTAdkNQbt4hv22yb9LDUe-Y1G3FrZniw42BwCjCqOQ0ERsx-TiesXf3SNJizwlqUnL7iQlhYHklLODzHfWZrgCIy8IWK_vPX5hhOKfQCNOSFAuFRk_8N5tCmyjqgS63SMeyoJvJ56yEDkutMa5HnBg-pKLkV9kqI648rUFZCntHXN4hdf9rvNZUVyZyf3r4gUxNeCJiMQ7Qj2qxt0Ui3kZFQ')"></div>
</div>
<div class="w-full max-w-[520px] relative z-10">
<!-- Header Section -->
<div class="text-center mb-10">
<h1 class="font-headline-lg text-headline-lg mb-2 text-primary">BuildVerse</h1>
<p class="font-body-md text-on-surface-variant">The architecture of your developer journey begins here.</p>
</div>
<!-- Main Multi-step Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-[24px] p-8 md:p-12 premium-shadow">
<!-- Progress Indicator -->
<div class="flex gap-2 mb-10">
<div class="h-1 flex-grow bg-primary rounded-full transition-all duration-500" id="bar-1"></div>
<div class="h-1 flex-grow bg-surface-container-highest rounded-full transition-all duration-500" id="bar-2"></div>
</div>
<form id="onboarding-form" onsubmit="return false;">
<!-- Step 1: Identity -->
<div class="step-transition" id="step-1">
<div class="mb-8">
<h2 class="font-headline-md text-headline-md mb-2">Create your identity</h2>
<p class="font-label-md text-on-surface-variant">Step 1 of 2</p>
</div>
<div class="space-y-6">
<div class="space-y-2">
<label class="font-label-md text-on-surface block">Full Name</label>
<input class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-white focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline" placeholder="John Doe" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-md text-on-surface block">Email Address</label>
<input class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-white focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline" placeholder="john@company.com" type="email"/>
</div>
<div class="space-y-2 relative">
<label class="font-label-md text-on-surface block">Password</label>
<input class="w-full px-4 py-3 rounded-xl border border-outline-variant bg-white focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline" placeholder="Min. 8 characters" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-[42px] text-on-surface-variant cursor-pointer" style="font-size: 20px;">visibility</span>
</div>
</div>
<button class="w-full mt-10 bg-primary text-on-primary font-label-md py-4 rounded-full hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" onclick="goToStep(2)" type="button">
                            Continue
                            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Step 2: Interests -->
<div class="step-transition hidden opacity-0 translate-x-8" id="step-2">
<div class="mb-8">
<h2 class="font-headline-md text-headline-md mb-2">Primary Interests</h2>
<p class="font-label-md text-on-surface-variant">Tailor your workspace experience</p>
</div>
<div class="grid grid-cols-2 gap-3 mb-10">
<button class="interest-chip group flex flex-col items-center justify-center p-4 rounded-2xl border border-outline-variant hover:border-primary transition-all gap-2 text-center" onclick="toggleInterest(this)" type="button">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">code</span>
<span class="font-label-md">Frontend</span>
</button>
<button class="interest-chip group flex flex-col items-center justify-center p-4 rounded-2xl border border-outline-variant hover:border-primary transition-all gap-2 text-center" onclick="toggleInterest(this)" type="button">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">terminal</span>
<span class="font-label-md">Backend</span>
</button>
<button class="interest-chip group flex flex-col items-center justify-center p-4 rounded-2xl border border-outline-variant hover:border-primary transition-all gap-2 text-center" onclick="toggleInterest(this)" type="button">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">smartphone</span>
<span class="font-label-md">Mobile</span>
</button>
<button class="interest-chip group flex flex-col items-center justify-center p-4 rounded-2xl border border-outline-variant hover:border-primary transition-all gap-2 text-center" onclick="toggleInterest(this)" type="button">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">database</span>
<span class="font-label-md">Data Science</span>
</button>
<button class="interest-chip group flex flex-col items-center justify-center p-4 rounded-2xl border border-outline-variant hover:border-primary transition-all gap-2 text-center" onclick="toggleInterest(this)" type="button">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">shield</span>
<span class="font-label-md">Security</span>
</button>
<button class="interest-chip group flex flex-col items-center justify-center p-4 rounded-2xl border border-outline-variant hover:border-primary transition-all gap-2 text-center" onclick="toggleInterest(this)" type="button">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">cloud</span>
<span class="font-label-md">DevOps</span>
</button>
</div>
<div class="flex gap-4">
<button class="w-1/3 bg-white border border-outline-variant text-primary font-label-md py-4 rounded-full hover:bg-surface-container-low active:scale-[0.98] transition-all" onclick="goToStep(1)" type="button">
                                Back
                            </button>
<button class="w-2/3 bg-primary text-on-primary font-label-md py-4 rounded-full hover:opacity-90 active:scale-[0.98] transition-all" type="submit">
                                Join BuildVerse

                    Already have an account? 
                    <a class="text-primary font-bold hover:underline" href="#">Log in</a>
</p>
<div class="mt-6 flex justify-center gap-6 text-on-surface-variant font-label-sm">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
</div>

</main>
<script>
        function goToStep(step) {
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            const bar1 = document.getElementById('bar-1');
            const bar2 = document.getElementById('bar-2');

            if (step === 2) {
                step1.classList.add('opacity-0', '-translate-x-8');
                setTimeout(() => {
                    step1.classList.add('hidden');
                    step2.classList.remove('hidden');
                    setTimeout(() => {
                        step2.classList.remove('opacity-0', 'translate-x-8');
                    }, 50);
                }, 300);
                bar2.classList.replace('bg-surface-container-highest', 'bg-primary');
            } else {
                step2.classList.add('opacity-0', 'translate-x-8');
                setTimeout(() => {
                    step2.classList.add('hidden');
                    step1.classList.remove('hidden');
                    setTimeout(() => {
                        step1.classList.remove('opacity-0', '-translate-x-8');
                    }, 50);
                }, 300);
                bar2.classList.replace('bg-primary', 'bg-surface-container-highest');
            }
        }

        function toggleInterest(btn) {
            btn.classList.toggle('active');
            const icon = btn.querySelector('.material-symbols-outlined');
            if (btn.classList.contains('active')) {
                icon.classList.replace('text-primary', 'text-white');
            } else {
                icon.classList.replace('text-white', 'text-primary');
            }
        }

        // Form Submission visual feedback
        document.getElementById('onboarding-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Joining...';
            setTimeout(() => {
                submitBtn.innerHTML = 'Welcome aboard!';
                submitBtn.classList.replace('bg-primary', 'bg-green-600');
            }, 1500);
        });
    </script>
