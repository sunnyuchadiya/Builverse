        body {
            background-color: #FAFAF8;
            -webkit-font-smoothing: antialiased;
        }
        .natural-shadow {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);

        .luxury-input:focus {
            outline: none;
            border-color: #111111;
            box-shadow: 0 0 0 2px rgba(17, 17, 17, 0.05);
        }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-surface min-h-screen flex flex-col">
<!-- Top Navigation Suppression: As per mandate, login is a transactional screen, so no Global Nav shell -->
<main class="flex-grow flex items-center justify-center px-container-padding py-12">
<div class="w-full max-w-[480px]">
<!-- Branding Header -->
<div class="text-center mb-12">
<h1 class="font-display text-display text-primary tracking-tighter mb-2">
                    BuildVerse
                </h1>
<p class="font-body-lg text-on-surface-variant">
                    Architecting the future of development.
                </p>
</div>
<!-- Login Card -->
<div class="bg-white border border-[#ECECEC] rounded-editorial p-stack-lg md:p-12 natural-shadow">
<h2 class="font-headline-md text-headline-md text-primary mb-8">Welcome back</h2>
<!-- Social Logins -->
<div class="grid grid-cols-1 gap-4 mb-8">
<button class="flex items-center justify-center gap-3 w-full h-14 rounded-full border border-[#ECECEC] bg-white hover:bg-[#F5F5F5] transition-colors duration-200 group active:scale-[0.98]">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M12.48 10.92v3.28h7.84c-.24 1.84-.909 3.164-2.108 4.032-1.2 1.056-2.904 1.872-5.732 1.872-4.836 0-8.916-3.084-8.916-7.8s4.08-7.8 8.916-7.8c2.604 0 4.512 1.02 5.904 2.34l2.304-2.304C18.576 2.4 15.9 1.152 12.48 1.152 6.096 1.152 1 6.248 1 12.624S6.096 24.096 12.48 24.096c3.48 0 6.12-1.152 8.124-3.228 2.088-2.064 2.724-4.968 2.724-7.38 0-.684-.06-1.284-.18-1.56H12.48z" fill="currentColor"></path>
</svg>
<span class="font-label-md text-label-md">Continue with Google</span>
</button>
<button class="flex items-center justify-center gap-3 w-full h-14 rounded-full border border-[#ECECEC] bg-white hover:bg-[#F5F5F5] transition-colors duration-200 group active:scale-[0.98]">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" fill="currentColor"></path>
</svg>
<span class="font-label-md text-label-md">Continue with GitHub</span>
</button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 mb-8">
<div class="h-[1px] flex-grow bg-[#ECECEC]"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">or</span>
<div class="h-[1px] flex-grow bg-[#ECECEC]"></div>
</div>
<!-- Form -->
<form class="space-y-6" id="loginForm" onsubmit="return false">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Email Address</label>
<input class="luxury-input w-full h-14 px-6 rounded-full border border-[#ECECEC] bg-white text-body-md placeholder:text-on-surface-variant transition-all duration-200" id="email" placeholder="name@company.com" type="email"/>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Forgot?</a>
</div>
<input class="luxury-input w-full h-14 px-6 rounded-full border border-[#ECECEC] bg-white text-body-md placeholder:text-on-surface-variant transition-all duration-200" id="password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full h-14 bg-[#111111] text-white rounded-full font-label-md text-label-md hover:bg-black transition-all active:scale-[0.98] mt-4" type="submit">
                        Sign in to Workspace
                    </button>
</form>
<!-- Signup Link -->
<div class="mt-8 pt-8 border-t border-[#ECECEC] text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        New to the universe? <a class="text-primary font-semibold hover:underline underline-offset-4" href="#">Create an account</a>
</p>
</div>
</div>
<!-- Footer Meta -->
<div class="mt-12 flex justify-center gap-8 text-on-surface-variant">
<a class="font-label-sm text-label-sm hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm hover:text-primary transition-colors" href="#">Security</a>
</div>
</div>
</main>
<!-- Side Image Background Decor (Subtle Visual Interest) -->
<div class="hidden lg:block fixed top-0 right-0 w-1/3 h-full overflow-hidden pointer-events-none opacity-40 z-[-1]">
<div class="w-full h-full bg-cover bg-center" data-alt="A sophisticated, high-end close-up shot of architectural structural models and blueprints resting on a minimalist white stone surface. The lighting is soft and directional, creating elegant long shadows that highlight the textures of the technical papers and the precision of the building prototypes. The overall aesthetic is clean, technical, and premium, echoing a Scandinavian design philosophy with a monochromatic palette." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuChFEc6P9CY7zb2FLagJwKH6jIidCP-A_86p3yaCkXUeTV1HeS7n9HUFHRz_cxbqJleRCwMNOoi9-C6E9wNg6kLOOxccot3z86O9uKJy7bPBb8sq24_q2Y2n4xd-CRM72cto0pm_YbjLzVOU-36DkI-hcWHAuUTfVayMiXZEe6Aj3Vyfb22FCMufgQTSLbhDaEI5gM-I1PSI929TbombxxZQ_TTy4cn48G0kcS-j-UUyfIKII1Z5k0syqXRJR2VzxLUZUl8Ty8vNg')"></div>
</div>
<script>
        // Simple micro-interactions
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.style.transition = 'transform 0.2s ease-out';
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        const form = document.getElementById('loginForm');
        form.addEventListener('submit', (e) => {
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<span class="flex items-center gap-2">Authenticating... <span class="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span></span>';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = 'Sign in to Workspace';
                btn.disabled = false;
            }, 1500);
        });
    </script>
</body></html>
