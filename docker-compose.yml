version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: buildverse_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildverse_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/buildverse
      - NODE_ENV=production
    depends_on:
      - mongodb

volumes:
  mongodb_data:
