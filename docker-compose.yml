version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: nexus-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nexus
    volumes:
      - mongodb-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/nexus
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-nexus-jwt-token-key
      CORS_ORIGIN: "*"
    depends_on:
      - mongodb
      - redis

volumes:
  mongodb-data:
